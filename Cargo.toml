[workspace]
members = ["minecraft-redox-core", "minecraft-redox-java", "minecraft-redox-gtnh", "minecraft-redox-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/codeandsolder/minecraft-redox"

[workspace.dependencies]
anyhow = "1"
num-bigint = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
tree-sitter = "0.25"
tree-sitter-java = "0.23"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
pedantic = { level = "warn", priority = -1 }
